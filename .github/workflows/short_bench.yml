name: Short Benchmark

on:
  workflow_dispatch:
    inputs:
      machine:
        type: choice
        description: Which machine to run benchmarks on
        options:
          - mi325
          - mi355
        default: mi325
      selected_backend:
        description: "Which backends to run benchmarks for (wave, iree, torch, hipblaslt, all)"
        required: false
        default: "all"
      selected_kernel:
        description: "Which kernels to run benchmarks for (conv, gemm, attention, all)"
        required: false
        default: "all"
      problems_url:
        description: "URL to problems to benchmark"
        required: true
      tuned_config_url:
        description: "URL to tuning configurations"
        required: false
      backend_specs_url:
        description: "URL to backend specifications"
        required: false
      metadata:
        description: "Optional: metadata string for tagging the result"
        required: false
      pr_branch:
        description: "Branch name to check out (e.g., feature/opt-pass)"
        required: false
      pr_repository:
        description: "Repository to check out from (e.g., iree-org/wave)"
        required: false
      pr_headsha:
        description: "Head sha of pull request that triggered dispatch"
        required: false
      trigger_id:
        description: "Backend trigger ID for linking"
        required: false
        default: "undefined"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.trigger_id }}-${{ inputs.machine }}
  cancel-in-progress: true

jobs:
  identifier:
    name: Benchmark Run Identifier
    runs-on: ubuntu-latest
    steps:
      - name: triggerId_${{ inputs.trigger_id }}
        run: |
          echo "Trigger ID: ${{ inputs.trigger_id }}"

  short_benchmark:
    name: Short Benchmark
    needs: identifier
    runs-on: "linux-${{ inputs.machine }}-1gpu-ossci-nod-ai"

    concurrency:
      group: kernel-benchmarking-${{ inputs.machine }}
      cancel-in-progress: false

    env:
      WAVE_CACHE_ON: 0
      DOCKER_IMAGE: kernel-bench:${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Parse Backend Specs
        id: backend_specs
        if: ${{ inputs.backend_specs_url }}
        run: |
          SPECS=$(curl -sL "${{ inputs.backend_specs_url }}")
          # Extract wave repo/branch from specs (wave or wave_* backends, e.g. wave_4wave_rocroller)
          WAVE_REPO=$(echo "$SPECS" | python3 -c "
          import json, sys
          specs = json.load(sys.stdin)
          for s in specs:
              b = str(s.get('backend', '')).lower()
              if (b == 'wave' or b.startswith('wave_')) and s.get('remoteRepository'):
                  print(s['remoteRepository'])
                  break
          " 2>/dev/null || echo "")
          WAVE_BRANCH=$(echo "$SPECS" | python3 -c "
          import json, sys
          specs = json.load(sys.stdin)
          for s in specs:
              b = str(s.get('backend', '')).lower()
              if (b == 'wave' or b.startswith('wave_')) and s.get('branch'):
                  print(s['branch'])
                  break
          " 2>/dev/null || echo "")
          # Extract rocm-libraries repo/branch: prefer any spec with buildMeta set,
          # fall back to rocroller variants for backward compatibility
          ROCM_LIBRARIES_REPO=$(echo "$SPECS" | python3 -c "
          import json, sys
          specs = json.load(sys.stdin)
          for s in specs:
              meta = s.get('buildMeta', {})
              if meta.get('rocmLibrariesRepo'):
                  print(meta['rocmLibrariesRepo'])
                  break
          " 2>/dev/null || echo "")
          ROCM_LIBRARIES_BRANCH=$(echo "$SPECS" | python3 -c "
          import json, sys
          specs = json.load(sys.stdin)
          for s in specs:
              meta = s.get('buildMeta', {})
              if meta.get('rocmLibrariesBranch'):
                  print(meta['rocmLibrariesBranch'])
                  break
          " 2>/dev/null || echo "")
          echo "wave_repo=$WAVE_REPO" >> $GITHUB_OUTPUT
          echo "wave_branch=$WAVE_BRANCH" >> $GITHUB_OUTPUT
          echo "rocm_libraries_repo=$ROCM_LIBRARIES_REPO" >> $GITHUB_OUTPUT
          echo "rocm_libraries_branch=$ROCM_LIBRARIES_BRANCH" >> $GITHUB_OUTPUT
          echo "Parsed wave repo: $WAVE_REPO, branch: $WAVE_BRANCH"
          echo "Parsed rocm-libraries repo: $ROCM_LIBRARIES_REPO, branch: $ROCM_LIBRARIES_BRANCH"


      - name: Build Docker Image
        run: |
          cd benchmark
          chmod +x ./docker/build_docker.sh
          ./docker/build_docker.sh \
            --machine ${{ inputs.machine }} \
            ${{ inputs.selected_backend != 'all' && format('--backends {0}', inputs.selected_backend) || '' }} \
            ${{ inputs.pr_repository && format('--wave-repo {0}', inputs.pr_repository) || '' }} \
            ${{ inputs.pr_branch && format('--wave-branch {0}', inputs.pr_branch) || '' }} \
            -t ${{ env.DOCKER_IMAGE }}

      - name: Run Benchmarks
        run: |
          cd benchmark
          chmod +x ./docker/run_bench.sh
          ./docker/run_bench.sh \
            --image ${{ env.DOCKER_IMAGE }} \
            --machine ${{ inputs.machine }} \
            --backends ${{ inputs.selected_backend }} \
            --kernel-types ${{ inputs.selected_kernel }} \
            --problems-url ${{ inputs.problems_url }} \
            ${{ inputs.tuned_config_url && format('--tuned-configs-url {0}', inputs.tuned_config_url) || '' }} \
            -o $(pwd)/benchmark_results

      - name: Upload benchmark results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: benchmark-results
          path: ./benchmark/benchmark_results/results/
